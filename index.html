<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Very Important Question</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Playfair+Display:wght@600;700;800&family=Oswald:wght@400;500;600;700&family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================================
         PHOTO TAPE HEADER
    ================================= -->

    <header class="photo-tape">

        <div class="tape-track">

            <img src="assets/photo-beach.jpg" alt="">
            <img src="assets/photo-window.jpg" alt="">
            <img src="assets/photo-beach.jpg" alt="">
            <img src="assets/photo-window.jpg" alt="">
            <img src="assets/photo-beach.jpg" alt="">
            <img src="assets/photo-window.jpg" alt="">

            <!-- duplicate set so the loop is seamless -->
            <img src="assets/photo-beach.jpg" alt="">
            <img src="assets/photo-window.jpg" alt="">
            <img src="assets/photo-beach.jpg" alt="">
            <img src="assets/photo-window.jpg" alt="">
            <img src="assets/photo-beach.jpg" alt="">
            <img src="assets/photo-window.jpg" alt="">

        </div>

    </header>


    <!-- ================================
         HERO
    ================================= -->

    <main class="hero">

        <section class="proposal">

            <p class="small-heading">
                A VERY IMPORTANT QUESTION
            </p>

            <h1>
                WILL YOU BE
            </h1>

            <h2>
                my girlfriend?
            </h2>


            <!-- Retro circle decoration -->
            <div class="circle-decoration">

                <div class="sun-rays"></div>

                <div class="vinyl-frame">
                    <img id="vinylImg" class="vinyl" src="assets/vinyl.png" alt="Spinning vinyl record">
                </div>

            </div>


            <!-- Ribbon -->
            <div class="ribbon">

                <div class="ribbon-left"></div>

                <div class="ribbon-center"></div>

                <div class="ribbon-right"></div>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button
                    id="yesButton"
                    class="answer-button yes-button"
                >
                    YES
                </button>

                <button
                    id="noButton"
                    class="answer-button no-button"
                >
                    NO
                </button>

            </div>

        </section>

    </main>


    <!-- ================================
         LOWER PAPER SECTION
    ================================= -->

    <section class="bottom-section">

        <div class="section-heading">

            <div class="heading-line">
                ★★★★★★★★★★★★★
            </div>

            <div class="heading-line">
                ★★★★★★★★★★★★★
            </div>

        </div>

        <div class="little-icon">
            ♥
        </div>

    </section>


    <audio id="bgSong" src="assets/audio/song.mp3" autoplay loop preload="auto"></audio>

    <script src="js/script.js"></script>

</body>
</html>
